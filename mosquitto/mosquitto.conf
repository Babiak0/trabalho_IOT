# Broker local (desenvolvimento / VM própria). Em produção use TLS (porta 8883)
# ou um broker gerenciado como o HiveMQ Cloud.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
