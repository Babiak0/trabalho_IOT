; Placa física (DHT11, LEDs nos GPIO 26/25):  pio run -e esp32dev -t upload   e   pio device monitor
; Simulação no Wokwi (DHT22, LEDs nos GPIO 18/19):  pio run -e wokwi
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:wokwi]
extends = env:esp32dev
build_flags = -DHARDWARE_WOKWI
